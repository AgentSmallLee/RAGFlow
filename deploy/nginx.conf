# RAGFlow Nginx 配置
# 放到 /etc/nginx/sites-available/ragflow，然后软链到 sites-enabled

server {
    listen 80;
    server_name your-domain.com;  # 改成你的域名，没有就删掉这行用 IP 访问

    # 客户端最大上传大小（支持上传大文档）
    client_max_body_size 100M;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式输出需要较长的超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;  # 关闭缓冲，保证流式输出即时
    }

    # WebSocket（Gradio 用 SSE，这条可以留着备用）
    location /queue/ {
        proxy_pass http://127.0.0.1:7860/queue/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
